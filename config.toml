# 你大学所有高级功能一个没关（代码复制、KaTeX、lightgallery、搜索……全保留）
[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = true
    # 行号不再走两列表格（table.lntable）：表格会把 390px 手机屏撑到 438px
    lineNumbersInTable = false
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[markup.tableOfContents]
  startLevel = 2
  endLevel = 6

[minify]
  disableXML = true
  minifyOutput = true


# 作者名字设置（加了这行，首页和文章页就显示你的名字了）

# 搜索索引不再用 index.json：Pagefind 在 hugo 构建后扫描 public/ 生成（见 workflow 的 pagefind 步骤）
# 作者信息（Hugo 0.168 起 .Site.Author 已移除，改走 params.author）
[params.author]
  name = "陈多伟"
  email = "duowei_chen@outlook.com"

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]